<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join PowWow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #E1DDD1;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #FDFCFB;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      display: block;
      border-radius: 16px;
      object-fit: contain;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #888;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .store-badges {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .store-badges a {
      display: block;
      line-height: 0;
      transition: opacity 0.2s;
    }

    .store-badges a:active { opacity: 0.8; }

    .store-badges img {
      height: 48px;
      width: auto;
      display: block;
    }

    .divider {
      color: #444;
      font-size: 13px;
      margin: 20px 0;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-top: 16px;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
    }

    .footer a {
      color: #888;
      font-size: 13px;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="AppIcon-small.png" alt="PowWow" />
    <h1>Family Walkie Talkie - Pow Wow</h1>

    <div class="divider">Don't have the app?</div>

    <div class="store-badges">
      <a id="iosBtn" href="https://apps.apple.com/app/id6764107757">
        <img src="badge-app-store.svg" alt="Download on the App Store" />
      </a>
      <a id="androidBtn" href="https://play.google.com/store/apps/details?id=com.gys.powwow">
        <img src="badge-google-play.svg" alt="Get it on Google Play" />
      </a>
    </div>

    <div id="status"></div>

    <div class="footer">
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
